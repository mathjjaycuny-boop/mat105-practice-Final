<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAT 105 Practice Review Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900 flex flex-col h-screen overflow-hidden">

  <!-- HEADER -->
  <header class="bg-blue-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
    <div>
      <h1 class="text-xl font-bold">CUNY John Jay College of Criminal Justice</h1>
      <p class="text-sm text-blue-200">MAT 105 — Practice Review & Study Dashboard</p>
    </div>
    <span class="bg-blue-800 text-xs px-3 py-1 rounded-full border border-blue-600">Free-Response Review Mode</span>
  </header>

  <!-- SPLIT VIEW -->
  <div class="flex flex-1 overflow-hidden">
    <!-- SIDEBAR -->
    <aside class="w-72 bg-white border-r border-gray-200 p-4 overflow-y-auto">
      <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Available Reviews</h2>
      <nav class="space-y-1" id="exam-nav"></nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto p-8 bg-gray-50">
      <div class="max-w-4xl mx-auto space-y-6">
        <h2 class="text-2xl font-bold text-gray-800 border-b pb-2" id="exam-title">Select a Review</h2>
        <div id="questions-container" class="space-y-6"></div>
      </div>
    </main>
  </div>

  <script>
    const EXAM_DATA = {"MAT_105_Final_Practice_Review_FA": {"key": "MAT_105_Final_Practice_Review_FA", "title": "MAT 105 Final Practice Review FA", "questions": [{"id": 1, "topic": "Question 1", "question": "Evaluate the arithmetic expression using order of operations: $6 + 3 \\times 4 - 18 \\div 2$", "answer": "$9$", "solution": "$6 + (3 \\times 4) - (18 \\div 2) = 6 + 12 - 9 = 9$"}, {"id": 2, "topic": "Question 2", "question": "Subtract $(4x^2 - 5x + 6)$ from $(8x^2 - 2x - 3)$ and simplify completely.", "answer": "$4x^2 + 3x - 9$", "solution": "$(8x^2 - 2x - 3) - (4x^2 - 5x + 6) = 4x^2 + 3x - 9$"}, {"id": 3, "topic": "Question 3", "question": "Simplify the expression so that all exponents are non-negative: $\\frac{20x^8 y^{-4}}{4x^{-3} y^2}$", "answer": "$\\frac{5x^{11}}{y^6}$", "solution": "$\\frac{20}{4} \\cdot x^{8 - (-3)} \\cdot y^{-4 - 2} = 5x^{11} y^{-6} = \\frac{5x^{11}}{y^6}$"}, {"id": 4, "topic": "Question 4", "question": "Solve the literal equation for $y$: $Px - Qy = R$", "answer": "$y = \\frac{Px - R}{Q}$", "solution": "$-Qy = R - Px \\implies Qy = Px - R \\implies y = \\frac{Px - R}{Q}$"}, {"id": 5, "topic": "Question 5", "question": "Factor the polynomial expression completely: $7x^3 - 28x$", "answer": "$7x(x - 2)(x + 2)$", "solution": "$7x(x^2 - 4) = 7x(x - 2)(x + 2)$"}, {"id": 6, "topic": "Question 6", "question": "Perform the operations and express the result in standard complex form $a + bi$: $(8 - 4i) - (-3 + 2i) + (2 - 5i)$", "answer": "$13 - 11i$", "solution": "$(8 - (-3) + 2) + (-4 - 2 - 5)i = 13 - 11i$"}, {"id": 7, "topic": "Question 7", "question": "Simplify the radical expression completely: $\\sqrt{150x^7 y^6}$ (assume $x, y \\ge 0$)", "answer": "$5x^3 y^3 \\sqrt{6x}$", "solution": "$\\sqrt{25 \\cdot 6 \\cdot x^6 \\cdot x \\cdot y^6} = 5x^3 y^3 \\sqrt{6x}$"}, {"id": 8, "topic": "Question 8", "question": "Solve using the square root property: $(x + 5)^2 = 20$", "answer": "$x = -5 \\pm 2\\sqrt{5}$", "solution": "$x + 5 = \\pm \\sqrt{20} = \\pm 2\\sqrt{5} \\implies x = -5 \\pm 2\\sqrt{5}$"}, {"id": 9, "topic": "Question 9", "question": "Perform complex division and express your answer in standard form $a + bi$: $\\frac{15i}{1 + 3i}$", "answer": "$\\frac{9}{2} + \\frac{3}{2}i$", "solution": "$\\frac{15i(1 - 3i)}{1^2 + 3^2} = \\frac{15i - 45i^2}{10} = \\frac{45 + 15i}{10} = \\frac{9}{2} + \\frac{3}{2}i$"}, {"id": 10, "topic": "Question 10", "question": "Solve the quadratic equation by factoring: $x(x - 5) = 24$", "answer": "$x = 8, -3$", "solution": "$x^2 - 5x - 24 = 0 \\implies (x - 8)(x + 3) = 0 \\implies x = 8, -3$"}, {"id": 11, "topic": "Question 11", "question": "Solve the power equation for $x$: $x^{1/3} = -4$", "answer": "$x = -64$", "solution": "Cube both sides: $x = (-4)^3 = -64$"}, {"id": 12, "topic": "Question 12", "question": "Factor the polynomial completely by grouping: $3x^3 - 12x^2 - 12x + 48$", "answer": "$3(x - 2)(x + 2)(x - 4)$", "solution": "$3[x^2(x - 4) - 4(x - 4)] = 3(x^2 - 4)(x - 4) = 3(x - 2)(x + 2)(x - 4)$"}, {"id": 13, "topic": "Question 13", "question": "Solve the quadratic equation by completing the square: $x^2 + 6x - 2 = 0$", "answer": "$x = -3 \\pm \\sqrt{11}$", "solution": "$x^2 + 6x + 9 = 2 + 9 \\implies (x + 3)^2 = 11 \\implies x = -3 \\pm \\sqrt{11}$"}, {"id": 14, "topic": "Question 14", "question": "Perform the multiplication and express in standard complex form $a + bi$: $(5 + 2i)^2$", "answer": "$21 + 20i$", "solution": "$(5 + 2i)^2 = 25 + 20i + 4i^2 = 25 - 4 + 20i = 21 + 20i$"}, {"id": 15, "topic": "Question 15", "question": "Solve the quadratic equation using the quadratic formula: $3x^2 + x - 2 = 0$", "answer": "$x = \\frac{2}{3}, -1$", "solution": "$(3x - 2)(x + 1) = 0 \\implies x = \\frac{2}{3}, -1$"}, {"id": 16, "topic": "Question 16", "question": "Solve the rational equation for $x$: $\\frac{x}{x - 3} - \\frac{2}{x + 2} = \\frac{10}{x^2 - x - 6}$", "answer": "$x = -4$", "solution": "$x(x + 2) - 2(x - 3) = 10 \\implies x^2 + 6 = 10 \\implies x^2 = 4 \\implies x = -4$ ($x=2$ is extr.)"}, {"id": 17, "topic": "Question 17", "question": "Solve the linear inequality and express your answer in interval notation: $-5x - 4 > 26$", "answer": "$(-\\infty, -6)$", "solution": "$-5x > 30 \\implies x < -6 \\implies (-\\infty, -6)$"}, {"id": 18, "topic": "Question 18", "question": "Solve the compound inequality and express your solution in interval notation: $-7 \\le -3x + 2 < 14$", "answer": "$(-4, 3]$", "solution": "$-9 \\le -3x < 12 \\implies 3 \\ge x > -4 \\implies (-4, 3]$"}, {"id": 19, "topic": "Question 19", "question": "Solve the absolute value inequality and express your answer in interval notation: $|x + 4| - 3 \\le 5$", "answer": "$[-12, 4]$", "solution": "$|x + 4| \\le 8 \\implies -8 \\le x + 4 \\le 8 \\implies [-12, 4]$"}, {"id": 20, "topic": "Question 20", "question": "Solve the absolute value inequality and express your answer in interval notation: $|-3x + 4| + 2 > 14$", "answer": "$\\left(-\\infty, -\\frac{8}{3}\\right) \\cup \\left(\\frac{16}{3}, \\infty\\right)$", "solution": "$|-3x + 4| > 12 \\implies -3x + 4 > 12 \\text{ or } -3x + 4 < -12 \\implies x < -\\frac{8}{3} \\text{ or } x > \\frac{16}{3}$"}, {"id": 21, "topic": "Question 21", "question": "Find the exact distance between the points $(7, -5)$ and $(3, -2)$.", "answer": "$d = 5$", "solution": "$d = \\sqrt{(3-7)^2 + (-2 - (-5))^2} = \\sqrt{16 + 9} = \\sqrt{25} = 5$"}, {"id": 22, "topic": "Question 22", "question": "Find the midpoint $M$ of the line segment connecting the endpoints $(-8, 6)$ and $(4, -2)$.", "answer": "$M = (-2, 2)$", "solution": "$M = \\left(\\frac{-8 + 4}{2}, \\frac{6 + (-2)}{2}\\right) = (-2, 2)$"}, {"id": 23, "topic": "Question 23", "question": "Write the standard form equation of the circle with center $(-4, 3)$ and radius $r = 7$.", "answer": "$(x + 4)^2 + (y - 3)^2 = 49$", "solution": "$(x - (-4))^2 + (y - 3)^2 = 7^2 \\implies (x + 4)^2 + (y - 3)^2 = 49$"}, {"id": 24, "topic": "Question 24", "question": "Complete the square to write the equation of the circle $x^2 + y^2 - 8x + 12y = 12$ in standard form, then identify its center $(h, k)$ and radius $r$.", "answer": "Center $(4, -6)$, Radius $r = 8$", "solution": "$(x^2 - 8x + 16) + (y^2 + 12y + 36) = 12 + 16 + 36 = 64 \\implies \\text{Center } (4, -6), r = 8$"}, {"id": 25, "topic": "Question 25", "question": "Given the function $f(x) = 4x^2 + 3x$, evaluate $f(-3)$.", "answer": "$f(-3) = 27$", "solution": "$f(-3) = 4(-3)^2 + 3(-3) = 36 - 9 = 27$"}, {"id": 26, "topic": "Question 26", "question": "Find the $x$-intercepts and $y$-intercept of $f(x) = |x| - 8$ as ordered pairs $(x, y)$.", "answer": "$x$-ints: $(-8, 0), (8, 0)$; $y$-int: $(0, -8)$", "solution": "$y$-int $(0, -8)$; $x$-int $(-8, 0), (8, 0)$"}, {"id": 27, "topic": "Question 27", "question": "Find the slope $m$ of the line passing through the points $(-6, 5)$ and $(4, -3)$.", "answer": "$m = -\\frac{4}{5}$", "solution": "$m = \\frac{-3 - 5}{4 - (-6)} = \\frac{-8}{10} = -\\frac{4}{5}$"}, {"id": 28, "topic": "Question 28", "question": "Determine the average rate of change for $f(x) = 3x^2 + 4$ on the interval $[1, 4]$.", "answer": "$\\text{AROC} = 15$", "solution": "$f(4) = 52, f(1) = 7 \\implies \\text{AROC} = \\frac{52 - 7}{4 - 1} = 15$"}, {"id": 29, "topic": "Question 29", "question": "Write the slope-intercept equation ($y = mx + b$) of the line passing through $(2, -4)$ with slope $m = 5$.", "answer": "$y = 5x - 14$", "solution": "$y - (-4) = 5(x - 2) \\implies y = 5x - 14$"}, {"id": 30, "topic": "Question 30", "question": "Write the slope-intercept equation ($y = mx + b$) of the line passing through $(3, -2)$ parallel to $3x - y = 7$.", "answer": "$y = 3x - 11$", "solution": "$3x - y = 7 \\implies m = 3$; $y - (-2) = 3(x - 3) \\implies y = 3x - 11$"}, {"id": 31, "topic": "Question 31", "question": "Write the slope-intercept equation ($y = mx + b$) of the line passing through $(4, -1)$ perpendicular to $x + 3y = 9$.", "answer": "$y = 3x - 13$", "solution": "$x + 3y = 9 \\implies m = -1/3 \\implies m_\\perp = 3$; $y - (-1) = 3(x - 4) \\implies y = 3x - 13$"}, {"id": 32, "topic": "Question 32", "question": "Find the slope-intercept equation ($y = mx + b$) of the line with $x$-intercept $(-4, 0)$ and $y$-intercept $(0, 12)$.", "answer": "$y = 3x + 12$", "solution": "$m = \\frac{12 - 0}{0 - (-4)} = 3 \\implies y = 3x + 12$"}, {"id": 33, "topic": "Question 33", "question": "Determine algebraically whether the function $g(x) = \\sqrt{36 - x^2}$ is even, odd, or neither.", "answer": "Even", "solution": "$g(-x) = \\sqrt{36 - (-x)^2} = \\sqrt{36 - x^2} = g(x) \\implies \\text{Even}$"}, {"id": 34, "topic": "Question 34", "question": "Determine algebraically whether the function $f(x) = 4x^5 - 3x^3 + 2x$ is even, odd, or neither.", "answer": "Odd", "solution": "$f(-x) = 4(-x)^5 - 3(-x)^3 + 2(-x) = -f(x) \\implies \\text{Odd}$"}, {"id": 35, "topic": "Question 35", "question": "Evaluate $g(-4)$ for the piecewise function: $g(x) = \\begin{cases} -3|x| - 2 & \\text{for } x \\le -2 \\\\ 5x + 4 & \\text{for } -2 < x < 3 \\\\ 6 & \\text{for } x \\ge 3 \\end{cases}$", "answer": "$g(-4) = -14$", "solution": "For $x = -4 \\le -2$: $g(-4) = -3|-4| - 2 = -14$"}, {"id": 36, "topic": "Question 36", "question": "Given $f(x) = 3x - 2$ and $h(x) = \\sqrt{x - 4}$, evaluate $(f - h)(13)$.", "answer": "$(f - h)(13) = 34$", "solution": "$f(13) = 3(13)-2 = 37, h(13) = \\sqrt{9} = 3 \\implies 37 - 3 = 34$"}, {"id": 37, "topic": "Question 37", "question": "Given $f(x) = 6x - 5$ and $g(x) = -2x + 8$, find the function $(f - g)(x)$ in simplest form.", "answer": "$(f - g)(x) = 8x - 13$", "solution": "$(6x - 5) - (-2x + 8) = 8x - 13$"}, {"id": 38, "topic": "Question 38", "question": "Given $f(x) = -3x + 4$ and $g(x) = 4x + 1$, find the composite function $(g \\circ f)(x)$ in simplest form.", "answer": "$(g \\circ f)(x) = -12x + 17$", "solution": "$g(f(x)) = 4(-3x + 4) + 1 = -12x + 17$"}, {"id": 39, "topic": "Question 39", "question": "For $f(x) = 9x - 4$, find and simplify the difference quotient $\\frac{f(x+h) - f(x)}{h}$ ($h \\neq 0$).", "answer": "$9$", "solution": "$\\frac{9(x+h)-4 - (9x-4)}{h} = \\frac{9h}{h} = 9$"}, {"id": 40, "topic": "Question 40", "question": "For $f(x) = 5x^2$, find and simplify the difference quotient $\\frac{f(x+h) - f(x)}{h}$ ($h \\neq 0$).", "answer": "$10x + 5h$", "solution": "$\\frac{5(x+h)^2 - 5x^2}{h} = \\frac{10xh + 5h^2}{h} = 10x + 5h$"}, {"id": 41, "topic": "Question 41", "question": "Find the vertex $(h, k)$ of the parabola $q(x) = -x^2 + 12x - 10$.", "answer": "Vertex $(6, 26)$", "solution": "$h = -\\frac{12}{2(-1)} = 6, k = -(6)^2 + 12(6) - 10 = 26 \\implies (6, 26)$"}, {"id": 42, "topic": "Question 42", "question": "Determine whether $f(x) = x^2 - 10x + 7$ has a minimum or maximum value, and state the coordinates of the vertex.", "answer": "Minimum at $(5, -18)$", "solution": "$a = 1 > 0 \\implies \\text{Min}$; $h = -\\frac{-10}{2} = 5, k = 5^2 - 10(5) + 7 = -18 \\implies \\text{Minimum at } (5, -18)$"}, {"id": 43, "topic": "Question 43", "question": "For $f(x) = 3(x + 5)(x - 2)^2$, list each zero, state its multiplicity, and describe the behavior of the graph at the $x$-axis (crosses or touches).", "answer": "Zero $-5$ (mult 1, crosses); Zero $2$ (mult 2, touches)", "solution": "Zero $-5$ (exp 1, crosses); Zero $2$ (exp 2, touches)"}, {"id": 44, "topic": "Question 44", "question": "Use polynomial long division to find the quotient and remainder for $(4x^2 + 25x + 22) \\div (x + 5)$.", "answer": "$4x + 5 - \\frac{3}{x+5}$", "solution": "$(4x^2 + 25x + 22) \\div (x + 5) = 4x + 5$ rem $-3 \\implies 4x + 5 - \\frac{3}{x+5}$"}, {"id": 45, "topic": "Question 45", "question": "Use synthetic division to divide $(x^2 + 5x - 24) \\div (x + 8)$.", "answer": "$x - 3$", "solution": "Synthetic division with $-8$: $[1, 5, -24] \\to [1, -3, 0] \\implies x - 3$"}, {"id": 46, "topic": "Question 46", "question": "Evaluate $f(-3)$ for $f(x) = x^3 + 5x^2 - 2x - 12$ using the Remainder Theorem and synthetic division.", "answer": "$f(-3) = 12$", "solution": "$f(-3) = (-3)^3 + 5(-3)^2 - 2(-3) - 12 = -27 + 45 + 6 - 12 = 12$"}, {"id": 47, "topic": "Question 47", "question": "List all possible rational zeros of $f(x) = 6x^4 - 2x^2 + 5$ using the Rational Zeros Theorem.", "answer": "$\\pm 1, \\pm 5, \\pm \\frac{1}{2}, \\pm \\frac{5}{2}, \\pm \\frac{1}{3}, \\pm \\frac{5}{3}, \\pm \\frac{1}{6}, \\pm \\frac{5}{6}$", "solution": "$p = 5 (\\pm 1, \\pm 5), q = 6 (\\pm 1, \\pm 2, \\pm 3, \\pm 6) \\implies \\pm 1, \\pm 5, \\pm \\frac{1}{2}, \\dots$"}, {"id": 48, "topic": "Question 48", "question": "Find a polynomial function $f(x)$ of degree 3 with integer coefficients that has zeros $2, 5, -3$ and leading coefficient $1$. Expand $f(x)$ completely.", "answer": "$f(x) = x^3 - 4x^2 - 11x + 30$", "solution": "$(x-2)(x-5)(x+3) = (x^2 - 7x + 10)(x + 3) = x^3 - 4x^2 - 11x + 30$"}, {"id": 49, "topic": "Question 49", "question": "Find the equation of the inverse function $f^{-1}(x)$ for the linear function $f(x) = 5x - 8$.", "answer": "$f^{-1}(x) = \\frac{x + 8}{5}$", "solution": "$x = 5y - 8 \\implies 5y = x + 8 \\implies y = \\frac{x + 8}{5}$"}, {"id": 50, "topic": "Question 50", "question": "Find the equation of the inverse function $f^{-1}(x)$ for the rational function $f(x) = \\frac{3x + 2}{x - 4}$ ($x \\neq 4$).", "answer": "$f^{-1}(x) = \\frac{4x + 2}{x - 3}$", "solution": "$x = \\frac{3y + 2}{y - 4} \\implies x(y - 4) = 3y + 2 \\implies y(x - 3) = 4x + 2 \\implies y = \\frac{4x + 2}{x - 3}$"}]}};
    let currentExamKey = Object.keys(EXAM_DATA)[0] || null;

    function renderSidebar() {
      const nav = document.getElementById('exam-nav');
      nav.innerHTML = '';
      Object.keys(EXAM_DATA).forEach(key => {
        const exam = EXAM_DATA[key];
        const a = document.createElement('a');
        a.href = "#";
        a.className = `block px-3 py-2 text-sm font-medium rounded-md transition ${key === currentExamKey ? 'bg-blue-900 text-white' : 'text-gray-700 hover:bg-gray-100'}`;
        a.innerText = exam.title;
        a.onclick = (e) => {
          e.preventDefault();
          currentExamKey = key;
          renderSidebar();
          renderExam();
        };
        nav.appendChild(a);
      });
    }

    function renderExam() {
      const container = document.getElementById('questions-container');
      const titleEl = document.getElementById('exam-title');
      
      if (!currentExamKey || !EXAM_DATA[currentExamKey]) {
        container.innerHTML = '<div class="text-gray-500">No review selected.</div>';
        return;
      }

      const exam = EXAM_DATA[currentExamKey];
      titleEl.innerText = exam.title;
      container.innerHTML = '';

      exam.questions.forEach((q) => {
        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-lg shadow-sm border border-gray-200 space-y-4";
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-gray-100 pb-3">
            <span class="font-bold text-blue-900 text-lg">Question ${q.id}</span>
            <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-medium">${q.topic}</span>
          </div>
          <div class="text-gray-800 leading-relaxed space-y-2">${q.question}</div>
          
          <div class="pt-4 border-t border-gray-100 flex flex-wrap gap-3 items-center justify-between">
            <button onclick="toggleSolution(${q.id})" class="bg-blue-900 text-white text-xs font-semibold px-4 py-2 rounded-md hover:bg-blue-800 transition shadow-sm">
              Toggle Answer & Solution
            </button>
          </div>

          <div id="solution-${q.id}" class="hidden p-4 bg-blue-50 border border-blue-100 rounded-md text-sm text-blue-950 space-y-3">
            <div>
              <span class="font-bold text-xs uppercase tracking-wider text-blue-800 block mb-1">Final Answer:</span>
              <div class="text-base font-semibold text-blue-900">${q.answer}</div>
            </div>
            <div class="border-t border-blue-200 pt-2">
              <span class="font-bold text-xs uppercase tracking-wider text-blue-800 block mb-1">Step-by-Step Derivation / Solution:</span>
              <div>${q.solution}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function toggleSolution(qId) {
      const sol = document.getElementById(`solution-${qId}`);
      if (sol) sol.classList.toggle('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      renderExam();
    });
  </script>
</body>
</html>
