  <script>
    const EXAM_DATA = {"MAT_105_Final_Practice_Review_MC": {"key": "MAT_105_Final_Practice_Review_MC", "title": "MAT 105 Final Practice Review MC", "questions": [{"id": 1, "topic": "Question 1", "question": "Evaluate the arithmetic expression: &nbsp;&nbsp;&nbsp;&nbsp; $6 + 3 \\times 4 - 18 \\div 2$", "options": ["9", "15", "27", "18"], "correct": 0, "solution": "$6 + (3 \\times 4) - (18 \\div 2) = 6 + 12 - 9 = 9$"}, {"id": 2, "topic": "Question 2", "question": "Subtract $(4x^2 - 5x + 6)$ from $(8x^2 - 2x - 3)$:", "options": ["4x^2 - 7x - 9", "4x^2 + 3x - 9", "12x^2 - 7x + 3", "4x^2 + 3x + 3"], "correct": 1, "solution": "$(8x^2 - 2x - 3) - (4x^2 - 5x + 6) = 4x^2 + 3x - 9$"}, {"id": 3, "topic": "Question 3", "question": "Simplify the expression with non-negative exponents: &nbsp;&nbsp;&nbsp;&nbsp; $\\frac{20x^8 y^{-4}}{4x^{-3} y^2}$", "options": ["\\frac{5x^{11}}{y^6}", "\\frac{5x^5}{y^6}", "5x^{11}y^2", "\\frac{20x^{11}}{y^6}"], "correct": 0, "solution": "$\\frac{20}{4} \\cdot x^{8 - (-3)} \\cdot y^{-4 - 2} = 5x^{11} y^{-6} = \\frac{5x^{11}}{y^6}$"}, {"id": 4, "topic": "Question 4", "question": "Solve the literal equation for $y$: &nbsp;&nbsp;&nbsp;&nbsp; $Px - Qy = R$", "options": ["y = \\frac{R - Px}{Q}", "y = \\frac{Px - R}{Q}", "y = \\frac{Px + R}{Q}", "y = Px - R"], "correct": 1, "solution": "$-Qy = R - Px \\implies Qy = Px - R \\implies y = \\frac{Px - R}{Q}$"}, {"id": 5, "topic": "Question 5", "question": "Factor the polynomial expression completely: &nbsp;&nbsp;&nbsp;&nbsp; $7x^3 - 28x$", "options": ["7x(x - 2)^2", "7(x - 2)(x + 2)", "7x(x - 2)(x + 2)", "7x(x^2 - 4)"], "correct": 2, "solution": "$7x(x^2 - 4) = 7x(x - 2)(x + 2)$"}, {"id": 6, "topic": "Question 6", "question": "Perform the operations in standard form $a + bi$: &nbsp;&nbsp;&nbsp;&nbsp; $(8 - 4i) - (-3 + 2i) + (2 - 5i)$", "options": ["13 - 11i", "7 - 11i", "13 - 7i", "3 - 11i"], "correct": 0, "solution": "$(8 - (-3) + 2) + (-4 - 2 - 5)i = 13 - 11i$"}, {"id": 7, "topic": "Question 7", "question": "Simplify the radical expression completely: &nbsp;&nbsp;&nbsp;&nbsp; $\\sqrt{150x^7 y^6}$", "options": ["5x^3 y^3 \\sqrt{6x}", "25x^3 y^3 \\sqrt{6x}", "5x^6 y^3 \\sqrt{6x}", "15x^3 y^3 \\sqrt{2x}"], "correct": 0, "solution": "$\\sqrt{25 \\cdot 6 \\cdot x^6 \\cdot x \\cdot y^6} = 5x^3 y^3 \\sqrt{6x}$"}, {"id": 8, "topic": "Question 8", "question": "Solve using the square root property: &nbsp;&nbsp;&nbsp;&nbsp; $(x + 5)^2 = 20$", "options": ["\\{-5 \\pm 2\\sqrt{5}\\}", "\\{5 \\pm 2\\sqrt{5}\\}", "\\{-5 \\pm 4\\sqrt{5}\\}", "\\{15, -25\\}"], "correct": 0, "solution": "$x + 5 = \\pm \\sqrt{20} = \\pm 2\\sqrt{5} \\implies x = -5 \\pm 2\\sqrt{5}$"}, {"id": 9, "topic": "Question 9", "question": "Perform division in standard form $a + bi$: &nbsp;&nbsp;&nbsp;&nbsp; $\\frac{15i}{1 + 3i}$", "options": ["\\frac{9}{2} + \\frac{3}{2}i", "\\frac{9}{2} - \\frac{3}{2}i", "3 + 9i", "9 - 3i"], "correct": 0, "solution": "$\\frac{15i(1 - 3i)}{1^2 + 3^2} = \\frac{15i - 45i^2}{10} = \\frac{45 + 15i}{10} = \\frac{9}{2} + \\frac{3}{2}i$"}, {"id": 10, "topic": "Question 10", "question": "Solve the quadratic equation: &nbsp;&nbsp;&nbsp;&nbsp; $x(x - 5) = 24$", "options": ["\\{-3, 8\\}", "\\{3, -8\\}", "\\{0, 5\\}", "\\{-24, 1\\}"], "correct": 0, "solution": "$x^2 - 5x - 24 = 0 \\implies (x - 8)(x + 3) = 0 \\implies x = 8, -3$"}, {"id": 11, "topic": "Question 11", "question": "Solve the power equation: &nbsp;&nbsp;&nbsp;&nbsp; $x^{1/3} = -4$", "options": ["64", "-64", "-12", "No solution"], "correct": 1, "solution": "Cube both sides: $x = (-4)^3 = -64$"}, {"id": 12, "topic": "Question 12", "question": "Factor completely by grouping: &nbsp;&nbsp;&nbsp;&nbsp; $3x^3 - 12x^2 - 12x + 48$", "options": ["3(x - 2)(x + 2)(x - 4)", "3(x^2 - 4)(x - 4)", "3(x - 2)^2(x - 4)", "(3x - 6)(x + 2)(x - 4)"], "correct": 0, "solution": "$3[x^2(x - 4) - 4(x - 4)] = 3(x^2 - 4)(x - 4) = 3(x - 2)(x + 2)(x - 4)$"}, {"id": 13, "topic": "Question 13", "question": "Solve by completing the square: &nbsp;&nbsp;&nbsp;&nbsp; $x^2 + 6x - 2 = 0$", "options": ["x = -3 \\pm \\sqrt{11}", "x = -6 \\pm \\sqrt{11}", "x = 3 \\pm \\sqrt{11}", "x = -3 \\pm 11"], "correct": 0, "solution": "$x^2 + 6x + 9 = 2 + 9 \\implies (x + 3)^2 = 11 \\implies x = -3 \\pm \\sqrt{11}$"}, {"id": 14, "topic": "Question 14", "question": "Perform the operation in standard form $a + bi$: &nbsp;&nbsp;&nbsp;&nbsp; $(5 + 2i)^2$", "options": ["21 + 20i", "29 + 20i", "21 + 10i", "25 + 4i"], "correct": 0, "solution": "$(5 + 2i)^2 = 25 + 20i + 4i^2 = 25 - 4 + 20i = 21 + 20i$"}, {"id": 15, "topic": "Question 15", "question": "Solve using the quadratic formula: &nbsp;&nbsp;&nbsp;&nbsp; $3x^2 + x - 2 = 0$", "options": ["\\{-1, \\frac{2}{3}\\}", "\\{1, -\\frac{2}{3}\\}", "\\{-1, -\\frac{2}{3}\\}", "\\{1, \\frac{2}{3}\\}"], "correct": 0, "solution": "$(3x - 2)(x + 1) = 0 \\implies x = \\frac{2}{3}, -1$"}, {"id": 16, "topic": "Question 16", "question": "Solve the rational equation: &nbsp;&nbsp;&nbsp;&nbsp; $\\frac{x}{x - 3} - \\frac{2}{x + 2} = \\frac{10}{x^2 - x - 6}$", "options": ["x = -4", "\\{-4, 2\\}", "x = 2", "No solution"], "correct": 0, "solution": "$x(x + 2) - 2(x - 3) = 10 \\implies x^2 + 6 = 10 \\implies x^2 = 4 \\implies x = -4$ ($x=2$ is extr.)"}, {"id": 17, "topic": "Question 17", "question": "Solve the linear inequality in interval notation: &nbsp;&nbsp;&nbsp;&nbsp; $-5x - 4 > 26$", "options": ["(-\\infty, -6)", "(-6, \\infty)", "(-\\infty, -6]", "(-\\infty, 6)"], "correct": 0, "solution": "$-5x > 30 \\implies x < -6 \\implies (-\\infty, -6)$"}, {"id": 18, "topic": "Question 18", "question": "Solve the compound inequality in interval notation: &nbsp;&nbsp;&nbsp;&nbsp; $-7 \\le -3x + 2 < 14$", "options": ["(-4, 3]", "[-4, 3)", "[-3, 4)", "(-3, 4]"], "correct": 0, "solution": "$-9 \\le -3x < 12 \\implies 3 \\ge x > -4 \\implies (-4, 3]$"}, {"id": 19, "topic": "Question 19", "question": "Solve the absolute value inequality: &nbsp;&nbsp;&nbsp;&nbsp; $|x + 4| - 3 \\le 5$", "options": ["[-12, 4]", "(-\\infty, -12] \\cup [4, \\infty)", "[-4, 12]", "[-8, 8]"], "correct": 0, "solution": "$|x + 4| \\le 8 \\implies -8 \\le x + 4 \\le 8 \\implies [-12, 4]$"}, {"id": 20, "topic": "Question 20", "question": "Solve the absolute value inequality: &nbsp;&nbsp;&nbsp;&nbsp; $|-3x + 4| + 2 > 14$", "options": ["\\left(-\\infty, -\\frac{8}{3}\\right) \\cup \\left(\\frac{16}{3}, \\infty\\right)", "\\left(-\\frac{8}{3}, \\frac{16}{3}\\right)", "\\left(-\\infty, -\\frac{16}{3}\\right) \\cup \\left(\\frac{8}{3}, \\infty\\right)", "\\left(-\\infty, \\frac{16}{3}\\right)"], "correct": 0, "solution": "$|-3x + 4| > 12 \\implies -3x + 4 > 12 \\text{ or } -3x + 4 < -12 \\implies x < -\\frac{8}{3} \\text{ or } x > \\frac{16}{3}$"}, {"id": 21, "topic": "Question 21", "question": "Find the exact distance between $(7, -5)$ and $(3, -2)$:", "options": ["5", "\\sqrt{65}", "25", "\\sqrt{13}"], "correct": 0, "solution": "$d = \\sqrt{(3-7)^2 + (-2 - (-5))^2} = \\sqrt{16 + 9} = \\sqrt{25} = 5$"}, {"id": 22, "topic": "Question 22", "question": "Find the midpoint of the segment with endpoints $(-8, 6)$ and $(4, -2)$:", "options": ["(-2, 2)", "(-4, 4)", "(2, -2)", "(-2, 4)"], "correct": 0, "solution": "$M = \\left(\\frac{-8 + 4}{2}, \\frac{6 + (-2)}{2}\\right) = (-2, 2)$"}, {"id": 23, "topic": "Question 23", "question": "Write the equation of the circle given center $(-4, 3)$ and radius $r = 7$:", "options": ["(x + 4)^2 + (y - 3)^2 = 49", "(x - 4)^2 + (y + 3)^2 = 49", "(x + 4)^2 + (y - 3)^2 = 7", "(x - 4)^2 + (y + 3)^2 = 7"], "correct": 0, "solution": "$(x - (-4))^2 + (y - 3)^2 = 7^2 \\implies (x + 4)^2 + (y - 3)^2 = 49$"}, {"id": 24, "topic": "Question 24", "question": "Complete the square to find center and radius of $x^2 + y^2 - 8x + 12y = 12$:", "options": ["Center: (4, -6), Radius: 8", "Center: (-4, 6), Radius: 64", "Center: (4, -6), Radius: 64", "Center: (-4, 6), Radius: 8"], "correct": 0, "solution": "$(x^2 - 8x + 16) + (y^2 + 12y + 36) = 12 + 16 + 36 = 64 \\implies \\text{Center } (4, -6), r = 8$"}, {"id": 25, "topic": "Question 25", "question": "Given $f(x) = 4x^2 + 3x$, evaluate $f(-3)$:", "options": ["27", "-27", "45", "-45"], "correct": 0, "solution": "$f(-3) = 4(-3)^2 + 3(-3) = 36 - 9 = 27$"}, {"id": 26, "topic": "Question 26", "question": "Find $x$-intercepts and $y$-intercept of $f(x) = |x| - 8$ as ordered pairs:", "options": ["x-intercepts: (-8, 0) and (8, 0); &nbsp;&nbsp;&nbsp;&nbsp; y-intercept: (0, -8)", "x-intercepts: (0, -8) and (0, 8); &nbsp;&nbsp;&nbsp;&nbsp; y-intercept: (-8, 0)", "x-intercept: (8, 0) only; &nbsp;&nbsp;&nbsp;&nbsp; y-intercept: (0, -8)", "x-intercepts: (-8, 0) and (8, 0); &nbsp;&nbsp;&nbsp;&nbsp; y-intercept: (0, 8)"], "correct": 0, "solution": "$y$-int $(0, -8)$; $x$-int $(-8, 0), (8, 0)$"}, {"id": 27, "topic": "Question 27", "question": "Find the slope of the line passing through $(-6, 5)$ and $(4, -3)$:", "options": ["-\\frac{4}{5}", "-\\frac{5}{4}", "\\frac{4}{5}", "-2"], "correct": 0, "solution": "$m = \\frac{-3 - 5}{4 - (-6)} = \\frac{-8}{10} = -\\frac{4}{5}$"}, {"id": 28, "topic": "Question 28", "question": "Determine average rate of change for $f(x) = 3x^2 + 4$ on $[1, 4]$:", "options": ["15", "45", "12", "18"], "correct": 0, "solution": "$f(4) = 52, f(1) = 7 \\implies \\text{AROC} = \\frac{52 - 7}{4 - 1} = 15$"}, {"id": 29, "topic": "Question 29", "question": "Equation of line passing through $(2, -4)$ with slope $m = 5$ in slope-intercept form:", "options": ["y = 5x - 14", "y = 5x + 6", "y = 5x - 6", "y = \\frac{1}{5}x - 14"], "correct": 0, "solution": "$y - (-4) = 5(x - 2) \\implies y = 5x - 14$"}, {"id": 30, "topic": "Question 30", "question": "Equation of line passing through $(3, -2)$ parallel to $3x - y = 7$:", "options": ["y = 3x - 11", "y = 3x + 11", "y = -\\frac{1}{3}x - 1", "y = 3x - 7"], "correct": 0, "solution": "$3x - y = 7 \\implies m = 3$; $y - (-2) = 3(x - 3) \\implies y = 3x - 11$"}, {"id": 31, "topic": "Question 31", "question": "Equation of line passing through $(4, -1)$ perpendicular to $x + 3y = 9$:", "options": ["y = 3x - 13", "y = -\\frac{1}{3}x + \\frac{1}{3}", "y = 3x + 11", "y = -3x + 11"], "correct": 0, "solution": "$x + 3y = 9 \\implies m = -1/3 \\implies m_\\perp = 3$; $y - (-1) = 3(x - 4) \\implies y = 3x - 13$"}, {"id": 32, "topic": "Question 32", "question": "Find slope-intercept equation of line with $x$-intercept $(-4, 0)$ and $y$-intercept $(0, 12)$:", "options": ["y = 3x + 12", "y = -3x + 12", "y = \\frac{1}{3}x + 12", "y = 3x - 4"], "correct": 0, "solution": "$m = \\frac{12 - 0}{0 - (-4)} = 3 \\implies y = 3x + 12$"}, {"id": 33, "topic": "Question 33", "question": "Determine algebraically whether $g(x) = \\sqrt{36 - x^2}$ is even, odd, or neither:", "options": ["Even", "Odd", "Neither", "Both Even and Odd"], "correct": 0, "solution": "$g(-x) = \\sqrt{36 - (-x)^2} = \\sqrt{36 - x^2} = g(x) \\implies \\text{Even}$"}, {"id": 34, "topic": "Question 34", "question": "Determine algebraically whether $f(x) = 4x^5 - 3x^3 + 2x$ is even, odd, or neither:", "options": ["Odd", "Even", "Neither", "Cannot be determined"], "correct": 0, "solution": "$f(-x) = 4(-x)^5 - 3(-x)^3 + 2(-x) = -f(x) \\implies \\text{Odd}$"}, {"id": 35, "topic": "Question 35", "question": "Evaluate $g(-4)$ for $g(x) = \\begin{cases} -3|x| - 2 & \\text{for } x \\le -2 \\\\ 5x + 4 & \\text{for } -2 < x < 3 \\\\ 6 & \\text{for } x \\ge 3 \\end{cases}$:", "options": ["-14", "-16", "10", "6"], "correct": 0, "solution": "For $x = -4 \\le -2$: $g(-4) = -3|-4| - 2 = -14$"}, {"id": 36, "topic": "Question 36", "question": "Given $f(x) = 3x - 2$ and $h(x) = \\sqrt{x - 4}$, evaluate $(f - h)(13)$:", "options": ["34", "37", "40", "31"], "correct": 0, "solution": "$f(13) = 3(13)-2 = 37, h(13) = \\sqrt{9} = 3 \\implies 37 - 3 = 34$"}, {"id": 37, "topic": "Question 37", "question": "Given $f(x) = 6x - 5$ and $g(x) = -2x + 8$, find $(f - g)(x)$:", "options": ["8x - 13", "4x + 3", "8x + 3", "4x - 13"], "correct": 0, "solution": "$(6x - 5) - (-2x + 8) = 8x - 13$"}, {"id": 38, "topic": "Question 38", "question": "Given $f(x) = -3x + 4$ and $g(x) = 4x + 1$, find composite function $(g \\circ f)(x)$:", "options": ["-12x + 17", "-12x + 13", "-12x - 15", "12x + 17"], "correct": 0, "solution": "$g(f(x)) = 4(-3x + 4) + 1 = -12x + 17$"}, {"id": 39, "topic": "Question 39", "question": "For $f(x) = 9x - 4$, find simplified difference quotient $\\frac{f(x+h) - f(x)}{h}$ ($h \\neq 0$):", "options": ["9", "9h", "9x - 4", "\\frac{9h - 8}{h}"], "correct": 0, "solution": "$\\frac{9(x+h)-4 - (9x-4)}{h} = \\frac{9h}{h} = 9$"}, {"id": 40, "topic": "Question 40", "question": "For $f(x) = 5x^2$, find simplified difference quotient $\\frac{f(x+h) - f(x)}{h}$ ($h \\neq 0$):", "options": ["10x + 5h", "5x + 5h", "10x", "5h"], "correct": 0, "solution": "$\\frac{5(x+h)^2 - 5x^2}{h} = \\frac{10xh + 5h^2}{h} = 10x + 5h$"}, {"id": 41, "topic": "Question 41", "question": "Find vertex of parabola $q(x) = -x^2 + 12x - 10$:", "options": ["(6, 26)", "(-6, -118)", "(6, -46)", "(-6, 26)"], "correct": 0, "solution": "$h = -\\frac{12}{2(-1)} = 6, k = -(6)^2 + 12(6) - 10 = 26 \\implies (6, 26)$"}, {"id": 42, "topic": "Question 42", "question": "Determine if $f(x) = x^2 - 10x + 7$ has min/max value and state coordinates:", "options": ["Minimum at (5, -18)", "Maximum at (5, -18)", "Minimum at (-5, 82)", "Maximum at (-5, -18)"], "correct": 0, "solution": "$a = 1 > 0 \\implies \\text{Min}$; $h = -\\frac{-10}{2} = 5, k = 5^2 - 10(5) + 7 = -18 \\implies \\text{Minimum at } (5, -18)$"}, {"id": 43, "topic": "Question 43", "question": "Zeros, multiplicities, and axis behavior for $f(x) = 3(x + 5)(x - 2)^2$:", "options": ["Zero -5 (mult. 1, crosses); Zero 2 (mult. 2, touches)", "Zero -5 (mult. 1, touches); Zero 2 (mult. 2, crosses)", "Zero 5 (mult. 1, crosses); Zero -2 (mult. 2, touches)", "Zero 5 (mult. 1, touches); Zero -2 (mult. 2, crosses)"], "correct": 0, "solution": "Zero $-5$ (exp 1, crosses); Zero $2$ (exp 2, touches)"}, {"id": 44, "topic": "Question 44", "question": "Long division quotient and remainder for $(4x^2 + 25x + 22) \\div (x + 5)$:", "options": ["4x + 5 - \\frac{3}{x+5}", "4x - 5 + \\frac{3}{x+5}", "4x + 5 + \\frac{3}{x+5}", "4x + 3 - \\frac{5}{x+5}"], "correct": 0, "solution": "$(4x^2 + 25x + 22) \\div (x + 5) = 4x + 5$ rem $-3 \\implies 4x + 5 - \\frac{3}{x+5}$"}, {"id": 45, "topic": "Question 45", "question": "Use synthetic division to divide: $(x^2 + 5x - 24) \\div (x + 8)$:", "options": ["x - 3", "x + 3", "x - 16", "x + 16"], "correct": 0, "solution": "Synthetic division with $-8$: $[1, 5, -24] \\to [1, -3, 0] \\implies x - 3$"}, {"id": 46, "topic": "Question 46", "question": "Evaluate $f(-3)$ for $f(x) = x^3 + 5x^2 - 2x - 12$ using Remainder Theorem:", "options": ["12", "0", "-6", "-18"], "correct": 0, "solution": "$f(-3) = (-3)^3 + 5(-3)^2 - 2(-3) - 12 = -27 + 45 + 6 - 12 = 12$"}, {"id": 47, "topic": "Question 47", "question": "List all possible rational zeros of $f(x) = 6x^4 - 2x^2 + 5$:", "options": ["\\pm 1, \\pm 5, \\pm \\frac{1}{2}, \\pm \\frac{5}{2}, \\pm \\frac{1}{3}, \\pm \\frac{5}{3}, \\pm \\frac{1}{6}, \\pm \\frac{5}{6}", "\\pm 1, \\pm 2, \\pm 3, \\pm 6, \\pm \\frac{1}{5}", "\\pm 1, \\pm 5, \\pm \\frac{1}{2}, \\pm \\frac{1}{3}, \\pm \\frac{1}{6}", "\\pm 1, \\pm 2, \\pm 3, \\pm \\frac{5}{6}"], "correct": 0, "solution": "$p = 5 (\\pm 1, \\pm 5), q = 6 (\\pm 1, \\pm 2, \\pm 3, \\pm 6) \\implies \\pm 1, \\pm 5, \\pm \\frac{1}{2}, \\dots$"}, {"id": 48, "topic": "Question 48", "question": "Expand polynomial $f(x)$ of degree 3 with zeros $2, 5, -3$ and leading coefficient $1$:", "options": ["f(x) = x^3 - 4x^2 - 11x + 30", "f(x) = x^3 + 4x^2 - 11x - 30", "f(x) = x^3 - 4x^2 + 11x + 30", "f(x) = x^3 - 10x^2 + 7x + 30"], "correct": 0, "solution": "$(x-2)(x-5)(x+3) = (x^2 - 7x + 10)(x + 3) = x^3 - 4x^2 - 11x + 30$"}, {"id": 49, "topic": "Question 49", "question": "Find the inverse function $f^{-1}(x)$ for the linear one-to-one function $f(x) = 5x - 8$:", "options": ["f^{-1}(x) = \\frac{x + 8}{5}", "f^{-1}(x) = \\frac{x - 8}{5}", "f^{-1}(x) = \\frac{1}{5x - 8}", "f^{-1}(x) = 8x - 5"], "correct": 0, "solution": "$x = 5y - 8 \\implies 5y = x + 8 \\implies y = \\frac{x + 8}{5}$"}, {"id": 50, "topic": "Question 50", "question": "Find the inverse function $f^{-1}(x)$ for the simple rational function $f(x) = \\frac{3x + 2}{x - 4}$ &nbsp;&nbsp;&nbsp;&nbsp; ($x \\neq 4$):", "options": ["f^{-1}(x) = \\frac{4x + 2}{x - 3}", "f^{-1}(x) = \\frac{4x - 2}{x + 3}", "f^{-1}(x) = \\frac{x - 4}{3x + 2}", "f^{-1}(x) = \\frac{3x - 4}{x + 2}"], "correct": 0, "solution": "$x = \\frac{3y + 2}{y - 4} \\implies x(y - 4) = 3y + 2 \\implies y(x - 3) = 4x + 2 \\implies y = \\frac{4x + 2}{x - 3}$"}]}};
    let currentExamKey = Object.keys(EXAM_DATA)[0] || null;

    function renderSidebar() {
      const nav = document.getElementById('exam-nav');
      nav.innerHTML = '';
      Object.keys(EXAM_DATA).forEach(key => {
        const exam = EXAM_DATA[key];
        const a = document.createElement('a');
        a.href = "#";
        a.className = `block px-3 py-2 text-sm font-medium rounded-md transition ${key === currentExamKey ? 'bg-blue-900 text-white' : 'text-gray-700 hover:bg-gray-150'}`;
        a.innerText = exam.title;
        a.onclick = (e) => {
          e.preventDefault();
          currentExamKey = key;
          renderSidebar();
          renderExam();
        };
        nav.appendChild(a);
      });
    }

    function renderExam() {
      const container = document.getElementById('questions-container');
      const titleEl = document.getElementById('exam-title');
      
      if (!currentExamKey || !EXAM_DATA[currentExamKey]) {
        container.innerHTML = '<div class="text-gray-500">No exam selected.</div>';
        return;
      }

      const exam = EXAM_DATA[currentExamKey];
      titleEl.innerText = exam.title;
      container.innerHTML = '';

      exam.questions.forEach((q) => {
        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-lg shadow-sm border border-gray-200 space-y-4";
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-gray-100 pb-3">
            <span class="font-bold text-blue-900 text-lg">Question ${q.id}</span>
            <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-medium">${q.topic}</span>
          </div>
          <div class="text-gray-800 leading-relaxed">${q.question}</div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
            ${q.options.map((opt, i) => `
              <button onclick="checkAnswer(${q.id}, ${i}, ${q.correct})" id="opt-${q.id}-${i}" 
                class="text-left p-3 border border-gray-200 rounded-md hover:border-blue-500 hover:bg-blue-50 transition text-sm">
                <span class="font-bold mr-2">${String.fromCharCode(65 + i)}.</span> $${opt}$
              </button>
            `).join('')}
          </div>
          <div class="pt-3 border-t border-gray-100 flex justify-between items-center">
            <button onclick="toggleSolution(${q.id})" class="text-xs font-semibold text-blue-700 hover:underline">
              View Explanation
            </button>
            <span id="feedback-${q.id}" class="text-sm font-bold"></span>
          </div>
          <div id="solution-${q.id}" class="hidden p-4 bg-blue-50 border border-blue-100 rounded-md text-sm text-blue-950">
            <div class="font-bold text-xs uppercase tracking-wider text-blue-800 mb-1">Explanation</div>
            <div>${q.solution}</div>
          </div>
        `;
        container.appendChild(card);
      });

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    function checkAnswer(qId, selectedIdx, correctIdx) {
      const feedback = document.getElementById(`feedback-${qId}`);
      for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`opt-${qId}-${i}`);
        if (btn) btn.classList.remove('bg-green-100', 'border-green-500', 'bg-red-100', 'border-red-500');
      }

      const selectedBtn = document.getElementById(`opt-${qId}-${selectedIdx}`);
      if (selectedIdx === correctIdx) {
        selectedBtn.classList.add('bg-green-100', 'border-green-500');
        feedback.className = "text-sm font-bold text-green-600";
        feedback.innerText = "✓ Correct!";
      } else {
        selectedBtn.classList.add('bg-red-100', 'border-red-500');
        feedback.className = "text-sm font-bold text-red-600";
        feedback.innerText = "✗ Try Again";
      }
    }

    function toggleSolution(qId) {
      const sol = document.getElementById(`solution-${qId}`);
      if (sol) sol.classList.toggle('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      renderExam();
    });
  </script>
</body>
</html>
